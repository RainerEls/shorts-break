name: Release

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Lint extension
        run: npx --yes web-ext@10.8.0 lint --source-dir . --ignore-files README.md ".gitea/**"

  release:
    needs: lint
    if: github.event_name == 'push'
    uses: SleepyShoggoth/actions/.gitea/workflows/auto-release.yml@main
    secrets: inherit

  package:
    needs: release
    if: needs.release.outputs.did_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Stamp version from tag
        env:
          TAG: ${{ needs.release.outputs.new_tag }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json"));
            m.version = process.env.TAG.replace(/^v/, "");
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
          '

      - name: Build zip
        run: npx --yes web-ext@10.8.0 build --source-dir . --artifacts-dir dist --filename "shorts-break-{version}.zip" --ignore-files README.md ".gitea/**"

      - name: Attach zip to release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_RELEASE_TOKEN }}
        with:
          tag_name: ${{ needs.release.outputs.new_tag }}
          files: dist/*.zip
