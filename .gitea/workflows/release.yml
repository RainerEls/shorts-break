name: Release

on:
  push:
    branches: [main]
    # Nothing here goes into the add-on zip, so changes to it alone make no release.
    paths-ignore:
      - ".gitea/**"
      - "test/**"
      - README.md
      - "docs/**"
      - package.json
      - package-lock.json
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Lint extension
        run: npx --yes web-ext@10.8.0 lint --source-dir . --ignore-files README.md ".gitea/**" docs "docs/**" test "test/**" package.json package-lock.json

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

  release:
    needs: [lint, test]
    if: github.event_name == 'push'
    uses: SleepyShoggoth/actions/.gitea/workflows/auto-release.yml@main
    secrets: inherit

  package:
    needs: release
    if: needs.release.outputs.did_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.new_tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Stamp version from tag
        env:
          TAG: ${{ needs.release.outputs.new_tag }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json"));
            m.version = process.env.TAG.replace(/^v/, "");
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");
          '

      - name: Build zip
        run: npx --yes web-ext@10.8.0 build --source-dir . --artifacts-dir dist --filename "shorts-break-{version}.zip" --ignore-files README.md ".gitea/**" docs "docs/**" test "test/**" package.json package-lock.json

      - name: Attach zip to release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_RELEASE_TOKEN }}
        with:
          tag_name: ${{ needs.release.outputs.new_tag }}
          files: dist/*.zip
