<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shorts Break Settings</title>
  <link rel="stylesheet" href="lib/style.css">
  <style>
    body { padding: 16px; max-width: 480px; }
    label { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; margin-bottom: 14px; }
    input[type=number] { width: 7ch; }
    .msg { min-height: 1.5em; color: var(--good); }
  </style>
</head>
<body>
  <form id="form">
    <label>Shorts time before locking (minutes)
      <input type="number" id="limitMinutes" min="1" max="240" required>
    </label>
    <label>Sudoku difficulty
      <select id="sudokuDifficulty">
        <option value="easy">Easy (40 clues)</option>
        <option value="medium">Medium (32 clues)</option>
        <option value="hard">Hard (27 clues)</option>
      </select>
    </label>
    <label>Math sprint problems
      <input type="number" id="mathProblems" min="3" max="30" required>
    </label>
    <button class="primary" type="submit">Save</button>
    <p class="muted">The timer only counts while a Short is playing in a visible tab. Changing the time limit adjusts the time you have left; it cannot lift a lock.</p>
    <p class="msg" id="msg" aria-live="polite"></p>
  </form>
  <script src="lib/common.js"></script>
  <script src="options.js"></script>
</body>
</html>
